{% extends 'navbar.html' %}
{% block title %}Список работ{% endblock title %}
{% block content %}
  <h1>All Jobs</h1>
  <ul class="job-list">
    {% for job in jobs %}
      <li class="job-item">
        <h2 class="job-title">{{ job.title }}</h2>
        <p class="job-description">{{ job.description }}</p>
      </li>
    {% endfor %}
  </ul>
{% endblock %}
