{% extends 'navbar.html' %}
{% block title %}Добавить отзыв{% endblock title %}
{% block content %}
    <div class="page-container">
        <div class="review-form-container">
            <h1 class="review-form-title">Написать отзыв</h1>
            <form method="post" action="{% url 'review_create' %}">
                {% csrf_token %}
                <div class="form-group">
                    <label for="rating">Оценка:</label>
                    <select id="rating" name="rating" class="form-control">
                        {% for i in ratings %}
                            <option value="{{ i }}">{{ i }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="review_text">Отзыв:</label>
                    <textarea id="review_text" name="review_text" rows="5" class="form-control"></textarea>
                </div>
                <button type="submit" class="submit-button">Сохранить</button>
            </form>
        </div>
    </div>
{% endblock %}
